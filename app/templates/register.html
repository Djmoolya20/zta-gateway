<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ZTA Gateway — Register</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 60px auto; }
    input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    select { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; font-family: inherit; }
    button { padding: 8px 18px; background: #337ab7; color: #fff; border: none;
             border-radius: 4px; cursor: pointer; }
    a { color: #337ab7; }
    h1 { font-size: 1.4em; }
  </style>
</head>
<body>
  <h1>Register for ZTA Gateway access</h1>
  <p>Accounts are created in a <b>pending</b> state and require admin approval
     before you can log in.</p>
  <form method="POST">
    <label>Username</label>
    <input name="username" placeholder="Username" required>
    <label>Email</label>
    <input name="email" type="email" placeholder="you@example.com" required>
    <label>Password</label>
    <input name="password" type="password" placeholder="Password" required>
    <label>Confirm password</label>
    <input name="confirm" type="password" placeholder="Confirm password" required>
    <label>Full Name</label>
    <input name="full_name" placeholder="e.g. Alice Smith" required>
    <label>Department / Category</label>
    <select name="department" required>
      <option value="">Select department / category</option>
      <option value="Engineering">Engineering</option>
      <option value="Guest">Guest</option>
      <option value="IoT/Lab Device">IoT / Lab Device</option>
      <option value="Administration">Administration</option>
      <option value="Other">Other</option>
    </select>
    <label>Device Description</label>
    <input name="device_description" placeholder="e.g. Personal laptop, Lab sensor" required>
    <label>Reason for Network Access</label>
    <textarea name="access_reason" placeholder="e.g. Course project requires network access to lab equipment" required></textarea>
    <label>Access Level</label>
    <select name="requested_access_level">
      <option value="standard">standard</option>
      <option value="restricted">restricted</option>
      <option value="elevated">elevated</option>
    </select>
    <button type="submit">Register</button>
  </form>
  <p><a href="{{ url_for('main.login') }}">&laquo; Back to login</a></p>
</body>
</html>
